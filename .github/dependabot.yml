version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(actions)'
  - package-ecosystem: npm
    directory: /labs/01-client-credentials
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'
